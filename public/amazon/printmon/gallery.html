<!DOCTYPE html>
<html lang="en">
<head>
	<base href="https://doshus.net/amazon/printmon/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printmon Gallery — Generated Themes</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQ1RGHNMZG"></script><script>function gtag(){dataLayer.push(arguments)}window.dataLayer=window.dataLayer||[],gtag("js",new Date),gtag("config","G-KQ1RGHNMZG");</script>
  <style>
    :root {
      --color-bg: #0a0a14;
      --color-surface: #141428;
      --color-surface-hover: #1e1e3a;
      --color-text-primary: #e8e8f0;
      --color-text-muted: #8888aa;
      --color-aurora-teal: #2dd4bf;
      --color-accent: #a855f7;
      --color-border: #252545;
      --glass-bg: rgba(20, 20, 40, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Amazon Ember', 'Segoe UI', Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Cosmic BG ──────────────────────────────── */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 30%, rgba(45, 212, 191, 0.06) 0%, transparent 60%),
        var(--color-bg);
    }

    /* ─── Header ─────────────────────────────────── */
    .gallery-header {
      padding: 2.5rem 2rem 1.5rem;
      text-align: center;
    }

    .gallery-header h1 {
      font-family: 'Showcard Gothic', 'Impact', sans-serif;
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--color-aurora-teal), var(--color-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .gallery-header .subtitle {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    /* ─── Search ─────────────────────────────────── */
    .search-bar {
      display: flex;
      justify-content: center;
      padding: 0 2rem 1.5rem;
    }

    .search-bar input {
      width: 100%;
      max-width: 480px;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      color: var(--color-text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-bar input:focus {
      border-color: var(--color-aurora-teal);
    }

    .search-bar input::placeholder {
      color: var(--color-text-muted);
    }

    /* ─── Count ──────────────────────────────────── */
    .gallery-count {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.8rem;
      padding-bottom: 0.5rem;
    }

    /* ─── Grid ───────────────────────────────────── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      padding: 0 2rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ─── Card ───────────────────────────────────── */
    .theme-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      animation: cardIn 0.5s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.15);
    }

    .card-preview {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-glow {
      position: absolute;
      inset: 8px;
      border: 1px solid;
      border-radius: 12px;
      opacity: 0.3;
    }

    .card-name {
      position: relative;
      font-family: 'Showcard Gothic', 'Impact', sans-serif;
      font-size: 1.3rem;
      color: white;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      text-align: center;
      padding: 0.5rem;
    }

    .card-body {
      padding: 0.75rem 1rem;
    }

    .card-tagline {
      color: var(--color-text-muted);
      font-size: 0.85rem;
      font-style: italic;
      margin-bottom: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-chips, .card-meta {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .chip {
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      color: white;
      opacity: 0.85;
    }

    /* ─── Modal ──────────────────────────────────── */
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      position: absolute;
      inset: 2rem;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .modal-top h3 {
      font-family: 'Showcard Gothic', 'Impact', sans-serif;
      font-size: 1.1rem;
      color: var(--color-text-primary);
    }

    .modal-top .modal-tagline {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      font-style: italic;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--color-text-primary);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    .modal-open-page {
      display: inline-block;
      margin: 8px 0;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: var(--color-accent);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .modal-open-page:hover {
      background: rgba(255,255,255,0.2);
      border-color: var(--color-accent);
    }

    .modal-frame-wrap {
      flex: 1;
      background: var(--color-bg);
    }

    .modal-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ─── Responsive ─────────────────────────────── */
    @media (max-width: 600px) {
      .gallery-header h1 { font-size: 1.8rem; }
      .theme-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 0.75rem;
        padding: 0 1rem 2rem;
      }
      .modal-content { inset: 1rem; }
    }

    /* ─── Loading ────────────────────────────────── */
    #loading {
      text-align: center;
      padding: 3rem;
      color: var(--color-text-muted);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <div class="cosmic-bg"></div>

  <header class="gallery-header">
    <h1>Printmon Gallery</h1>
    <p class="subtitle">Themes generated by the community. Click to preview.</p>
  </header>

  <div class="search-bar">
    <input id="gallerySearch" type="text" placeholder="Search themes…" autocomplete="off">
  </div>

  <div class="gallery-count">
    <span id="themeCount">0</span> themes
  </div>

  <div id="loading" style="text-align:center;padding:3rem;color:var(--color-text-muted);">
    Loading generated themes…
  </div>

  <div class="theme-grid" id="themeGrid"></div>

  <!-- Preview Modal -->
  <div class="preview-modal" id="previewModal">
    <div class="modal-content">
      <div class="modal-top">
        <div>
          <h3 id="previewName">Theme Name</h3>
          <span class="modal-tagline" id="previewTagline">tagline</span>
        </div>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <button class="modal-open-page" id="previewLink" style="display:none;">🔗 Open Full Page ↗</button>
      <div class="modal-frame-wrap">
        <iframe id="previewFrame" src="" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </div>

  <script src="js/PrintmonGallery.js"></script>
</body>
</html>
