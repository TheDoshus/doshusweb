<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Printmon Gallery…</title>
  <script>
    const target = new URL('../gallery.html', window.location.href);
    const theme = new URLSearchParams(window.location.search).get('theme');
    if (theme) target.searchParams.set('theme', theme);
    window.location.replace(target.href);
  </script>
  <meta http-equiv="refresh" content="0; url=../gallery.html">
</head>
<body>
  <p><a href="../gallery.html">Open the Printmon Gallery</a></p>
</body>
</html>
